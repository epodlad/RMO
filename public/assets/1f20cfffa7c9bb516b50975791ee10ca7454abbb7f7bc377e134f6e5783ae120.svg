  <g id="text_21">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #435258" transform="translate(49.68 367.677312)">The whole chosen model domain passes conservation, entropy and characteristic-speed checks.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #435258" transform="translate(49.68 381.154656)">Bars are conservative mathematical enclosures, not confidence intervals or measured wave speeds.</text>
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #435258" transform="translate(49.68 394.632)">Upstream plasma at rest is assumed. No solar field angle was inferred. Ma et al. / Kozarev et al. (2011).</text>
