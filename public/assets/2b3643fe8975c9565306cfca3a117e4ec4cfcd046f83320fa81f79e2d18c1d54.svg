  <g id="text_16">
   <text style="font-size: 18px; font-family: 'DejaVu Sans'; text-anchor: middle" x="460.8" y="37.653188" transform="rotate(-0 460.8 37.653188)">13 June 2010: a fast-shock model survives the input bounds</text>
  </g>
  <g id="text_17">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #53656a" x="460.8" y="55.944" transform="rotate(-0 460.8 55.944)">Published inputs: Ma et al. (2011) and Kozarev et al. (2011) | Conditional RMO calculation</text>
  </g>
  <g id="text_18">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: middle" x="460.8" y="83.1168" transform="rotate(-0 460.8 83.1168)">Fixed assumptions: field along the front surface; upstream plasma at rest; common front</text>
  </g>
  <g id="text_19">
   <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243a40" x="59.904" y="423.576" transform="rotate(-0 59.904 423.576)">Result: the flow crosses from super-fast to sub-fast throughout the tested, conservation-linked domain.</text>
  </g>
  <g id="text_20">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243a40" x="59.904" y="453.9456" transform="rotate(-0 59.904 453.9456)">Density and magnetic field increase together; mass, momentum, energy and entropy checks pass.</text>
  </g>
  <g id="text_21">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #53656a" x="59.904" y="486.9792" transform="rotate(-0 59.904 486.9792)">Bars: model envelopes, not observational confidence intervals. Front speed 496-667 km/s; sound speed 126-186 km/s.</text>
  </g>
  <g id="text_22">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #53656a" x="59.904" y="512.5536" transform="rotate(-0 59.904 512.5536)">The assumed geometry and plasma flow are not established by this calculation. The observed solar type remains open.</text>
  </g>
